[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E402: run.py adds src/ to sys.path before app imports — intentional.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports are intentional.
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
